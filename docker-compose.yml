services:
  miio-fakecloud:
    image: ghcr.io/eugene-reim/miio-fakecloud:latest
    container_name: miio-fakecloud
    restart: unless-stopped
    ports:
      - "8053:8053/udp"
      - "8053:8053/tcp"
    # Harden the container: no capabilities, read-only root filesystem
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Prevent unbounded log growth
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
